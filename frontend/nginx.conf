# ===================================================================
# 文件：frontend/nginx.conf（前端容器的 nginx 站点配置）
# 用途：两条核心规则——① 静态页面直接返回 ② /api/ 开头反向代理到后端容器
# 效果：浏览器只访问前端一个域名，跨域问题在网关层解决（前端无需知道后端地址）
# ===================================================================
server {  # 一个 HTTP 站点配置块
  listen 80;  # 监听容器内 80 端口（与 Dockerfile EXPOSE 一致）
  server_name _;  # 通配主机名：不挑域名，任何请求都命中本站点
  root /usr/share/nginx/html;  # 静态文件根目录（index.html 放在这里）

  location /api/ {  # 规则①：所有 /api/ 开头的请求转发给后端
    proxy_pass http://backend:8000;  # 转发目标：compose 网络里的 backend 服务（服务名即主机名）8000 端口
    proxy_set_header Host $host;  # 透传原始 Host 头（后端虚拟主机/日志用）
    proxy_set_header X-Request-ID $http_x_request_id;  # 透传请求 ID（后端链路追踪用，全链路同一个 ID）
    proxy_set_header X-Real-IP $remote_addr;  # 透传真实客户端 IP（否则后端只看到 nginx 的 IP）
  }

  location / {  # 规则②：其余请求按静态文件处理
    try_files $uri /index.html;  # 先找对应文件，找不到一律回退 index.html（单页应用兜底）
  }
}
