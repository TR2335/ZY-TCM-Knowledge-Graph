# ============================================================
# 文件用途：本草通 2.0（tcm-kgs）Docker 基础设施配置
# 核心功能：
#   - Neo4j 2025 社区版 + APOC + GDS 插件：图数据库与 HNSW 向量索引一库承载（ADR-003）
#   - Langfuse v2 自托管可观测栈：通过 profile（observability）隔离按需启动
# 如何使用：
#   make up                 # 仅 Neo4j（默认，日常开发）
#   make up-observability   # + Langfuse 可观测栈（profile 隔离，B6）
#   make init-db            # 应用 12 类实体 UNIQUE 约束（scripts/init_constraints.cypher）
# 说明：
#   - 密码经 .env 的 NEO4J_PASSWORD 覆盖，默认 tcmkg-dev-password 仅限本地开发
# ============================================================
# 本草通 2.0（tcm-kgs）本地基础设施（B3）
#
# 用法：
#   make up                 # 仅 Neo4j（默认，日常开发）
#   make up-observability   # + Langfuse 可观测栈（profile 隔离，B6）
#   make init-db            # 应用 12 类实体 UNIQUE 约束（scripts/init_constraints.cypher）
#
# 说明：
# - Neo4j 2025 社区版 + APOC + GDS 插件（ADR-003：图 + HNSW 向量一库）；
# - Langfuse v2 单容器 + Postgres（profile: observability）。
#   v3 需 ClickHouse/S3 全栈，待 Phase E trace 量起来后评估升级；
# - 密码经 .env 的 NEO4J_PASSWORD 覆盖，默认 tcmkg-dev-password 仅限本地开发。

services:
  neo4j:
    image: neo4j:2025.01.0-community
    container_name: tcm-kgs-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-tcmkg-dev-password}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    ports:
      - "7474:7474" # HTTP（浏览器 http://localhost:7474）
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    build:
      context: ./backend
    container_name: tcm-kgs-backend
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      TCM_NEO4J__URI: bolt://neo4j:7687
      TCM_NEO4J__USER: neo4j
      TCM_NEO4J__PASSWORD: ${NEO4J_PASSWORD:-tcmkg-dev-password}
      TCM_API__HOST: 0.0.0.0
      TCM_API__PORT: 8000
      TCM_API__ENVIRONMENT: ${TCM_API_ENVIRONMENT:-production}
      TCM_LLM__BASE_URL: ${TCM_LLM_BASE_URL:-https://api.openai.com/v1}
      TCM_LLM__API_KEY: ${TCM_LLM_API_KEY:-unset}
      TCM_LLM__MODEL: ${TCM_LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: tcm-kgs-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

  # ===== Langfuse 自托管（profile 隔离；make up-observability 启用）=====
  langfuse-db:
    image: postgres:16-alpine
    container_name: tcm-kgs-langfuse-db
    profiles: ["observability"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    container_name: tcm-kgs-langfuse
    profiles: ["observability"]
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: tcm-kgs-dev-nextauth-secret-change-me
      SALT: tcm-kgs-dev-salt-change-me
      TELEMETRY_ENABLED: "false"
    ports:
      - "3001:3000" # Web UI http://localhost:3001（首次访问需注册管理员并建项目拿密钥）

volumes:
  neo4j_data:
  neo4j_logs:
  langfuse_db_data:
